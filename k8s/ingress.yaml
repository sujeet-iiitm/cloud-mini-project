apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser-ingress
  namespace: app
  annotations:
    ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parser-service
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: parser-service
                port:
                  number: 8000
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: parser-service
                port:
                  number: 8000
