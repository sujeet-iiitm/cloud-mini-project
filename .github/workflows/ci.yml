name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      test_bad_model:
        description: 'Set to true to test quality gate failure with untrained model'
        required: false
        default: 'false'

jobs:
  ci:
    name: Build, Test, Evaluate and Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stage 1: Linting
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest fastapi httpx pydantic pyyaml psutil

      - name: Stage 1 - Code Linting
        run: |
          echo "Running flake8 lint checks..."
          flake8 service/ worker/ tools/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service/ worker/ tools/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      # Stage 2: Unit Tests (at least three tests)
      - name: Stage 2 - Run Unit Tests
        run: |
          echo "Running unit test suite..."
          python -m unittest discover -s tests -p "test_*.py"

      # Stage 3: Model Evaluation (download from GitHub Release / repository artifacts)
      - name: Stage 3 - Download Model Artefacts and Generate Evaluation
        run: |
          echo "Retrieving model artifacts for evaluation..."
          mkdir -p models/v1
          # In local/simulated CI or release download:
          if [ "${{ github.event.inputs.test_bad_model }}" = "true" ]; then
            echo "Running quality gate failure test using untrained model predictions..."
            cp results/predictions_untrained.jsonl results/eval_predictions.jsonl
          else
            echo "Using student distilled model predictions..."
            cp results/predictions_student.jsonl results/eval_predictions.jsonl
          fi

      # Stage 4: Quality Gate
      - name: Stage 4 - Quality Gate Verification
        run: |
          echo "Evaluating predictions against validation set with quality gate (--min-validity 95)..."
          python tools/score.py results/eval_predictions.jsonl data/validation.jsonl --min-validity 95 --out results/ci_evaluation_report.json

      # Stage 5: Secret Scanning (Gitleaks)
      - name: Stage 5 - Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
